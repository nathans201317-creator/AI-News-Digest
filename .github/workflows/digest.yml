name: Daily AI Digest

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC daily — adjust to your timezone
  workflow_dispatch: {}     # lets you trigger it manually from the GitHub Actions tab

permissions:
  contents: write   # needed so this workflow can commit the site's story data back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBSCRIBERS_ENDPOINT: ${{ secrets.SUBSCRIBERS_ENDPOINT }}
      - name: Commit today's site data back to the repo
        run: |
          git config user.name "Uplink Digest Bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "Update site data for $(date -u +%Y-%m-%d)"
          git push

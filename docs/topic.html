<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uplink — Topic</title>
<style>
  :root {
    --ink: #241F3D;
    --cream: #FFFBF5;
    --white: #FFFFFF;
    --muted: #7A7590;
    --coral: #FF5C7A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; }
  .logo {
    font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
  }
  nav a.back { font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 700; }

  .topic-badge {
    display: inline-block; font-size: 13px; font-weight: 800;
    padding: 6px 14px; border-radius: 20px; margin-bottom: 14px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 6px; }
  .subhead { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }

  .story {
    background: var(--white); border-radius: 20px; padding: 22px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(36,31,61,0.06);
    border-left: 5px solid var(--ink);
  }
  .story-top { display: flex; gap: 16px; align-items: flex-start; }
  .story-thumb {
    width: 84px; height: 84px; border-radius: 12px; flex-shrink: 0;
    object-fit: cover; display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .story-title { font-size: 19px; font-weight: 800; line-height: 1.3; color: var(--ink); text-decoration: none; display: block; }
  .story-title:hover { text-decoration: underline; }
  .story-source { font-size: 12px; font-weight: 800; margin-top: 6px; }
  .story-paragraph { font-size: 15px; line-height: 1.7; margin-top: 16px; color: #3A3558; }
  .story-link {
    display: inline-block; margin-top: 14px; font-size: 13.5px; font-weight: 800;
    text-decoration: none; padding: 8px 16px; border-radius: 100px;
  }

  .other-topics { margin-top: 36px; }
  .other-topics h2 { font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 12px; }
  .other-topics a {
    display: inline-block; margin: 0 8px 8px 0; font-size: 13px; font-weight: 800;
    padding: 8px 14px; border-radius: 100px; text-decoration: none;
  }

  .loading, .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .story-top { flex-direction: column; }
    .story-thumb { width: 100%; height: 150px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a class="logo" href="/">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="28" r="6" fill="#241F3D"/>
        <path d="M11 20a12.7 12.7 0 0 1 18 0" stroke="#FF5C7A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M6 13a19.5 19.5 0 0 1 28 0" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
      Uplink
    </a>
    <a class="back" href="/">← Back home</a>
  </nav>

  <div id="header"></div>
  <div id="content"><div class="loading">Loading stories…</div></div>
  <div class="other-topics" id="otherTopics"></div>
</div>

<script>
  const DATA_DIR = "/data";

  // URL code -> section name exactly as saved by the daily run
  const TOPICS = {
    ai:       "AI & Machine Learning",
    bigtech:  "Big Tech & Gadgets",
    startups: "Startups & Funding",
    science:  "Science & Research",
    crypto:   "Crypto",
  };

  function esc(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  async function init() {
    const code = new URLSearchParams(location.search).get("c");
    const content = document.getElementById("content");
    if (!TOPICS[code]) {
      content.innerHTML = '<div class="empty">Topic not found. <a href="/">Go home</a></div>';
      return;
    }
    try {
      const indexResp = await fetch(`${DATA_DIR}/index.json`, { cache: "no-store" });
      const dates = (await indexResp.json()).dates || [];
      if (dates.length === 0) {
        content.innerHTML = '<div class="empty">No stories yet — check back after tomorrow\'s digest.</div>';
        return;
      }
      const data = await (await fetch(`${DATA_DIR}/${dates[0]}.json`, { cache: "no-store" })).json();
      const cat = data.categories.find(c => c.name === TOPICS[code]);
      if (!cat) {
        content.innerHTML = '<div class="empty">No stories in this topic today.</div>';
        return;
      }
      document.title = `Uplink — ${cat.name}`;
      render(cat, data, code);
      renderOtherTopics(data, code);
    } catch (err) {
      content.innerHTML = '<div class="empty">Couldn\'t load stories right now. Please try again shortly.</div>';
    }
  }

  function render(cat, data, code) {
    document.getElementById("header").innerHTML = `
      <span class="topic-badge" style="background:${cat.tint};color:${cat.color};">${cat.emoji}&nbsp;&nbsp;${esc(cat.name)}</span>
      <h1>Today in ${esc(cat.name)}</h1>
      <div class="subhead">${esc(data.display_date)} · ${cat.articles.length} stories</div>
    `;

    const content = document.getElementById("content");
    content.innerHTML = "";
    cat.articles.forEach(a => {
      const thumb = a.image
        ? `<img class="story-thumb" src="${esc(a.image)}" alt="" style="background-color:${cat.tint};">`
        : `<div class="story-thumb" style="background-color:${cat.tint};">${cat.emoji}</div>`;
      // Older saved days only have the one-line summary — fall back to it.
      const paragraph = a.paragraph || a.summary || "";
      const el = document.createElement("div");
      el.className = "story";
      el.style.borderLeftColor = cat.color;
      el.innerHTML = `
        <div class="story-top">
          ${thumb}
          <div>
            <a class="story-title" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
            <div class="story-source" style="color:${cat.color};">${esc(a.source)}</div>
          </div>
        </div>
        <p class="story-paragraph">${esc(paragraph)}</p>
        <a class="story-link" href="${esc(a.link)}" target="_blank" rel="noopener"
           style="background:${cat.tint};color:${cat.color};">Read the full story on ${esc(a.source)} ↗</a>
      `;
      content.appendChild(el);
    });
  }

  function renderOtherTopics(data, currentCode) {
    const box = document.getElementById("otherTopics");
    let html = "<h2>More topics</h2>";
    Object.keys(TOPICS).forEach(code => {
      if (code === currentCode) return;
      const c = data.categories.find(x => x.name === TOPICS[code]);
      if (!c) return;
      html += `<a href="/topic.html?c=${code}" style="background:${c.tint};color:${c.color};">${c.emoji} ${esc(c.name)}</a>`;
    });
    box.innerHTML = html;
  }

  init();
</script>

</body>
</html>
